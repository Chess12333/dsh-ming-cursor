# 轻量版 AI 光标：只有「画出来」和「说一句」，不截屏、不点击、不碰键盘。
# mode: companion（一直陪着，默认）/ clean（露一下自己收）
# size: 24–192 像素；style: 15 只里选一只
# 这些值只是默认档：设置页里改过之后以 ~/.dsh/ming-cursor/settings.json 为准。
- insert:
    - id: ming-cursor
      name: dsh-ming-cursor
      config:
        mode: companion
        holdMs: 2600
        size: 64
        style: pointer
